name: PHP Plugin CI (reusable)

# Reusable CI for every WPPoland storefront plugin. Callers add a thin wrapper:
#
#   jobs:
#     ci:
#       uses: wppoland/workflows/.github/workflows/_php-ci.yml@v1
#       with:
#         slug: restock      # text-domain + i18n domain
#         has-js: true       # plugin has a JS/asset build (npm run build)
#         run-i18n: true     # diff languages/<slug>.pot against a fresh make-pot
#
# Ported and generalized from polski's ci.yml. Polski-specific steps (smoke-fatal
# script path, PRO deactivate, _benchmark excludes) are parametrized or dropped.

on:
  workflow_call:
    inputs:
      slug:
        description: 'Plugin slug = text-domain = i18n domain'
        required: true
        type: string
      php-versions:
        description: 'JSON array of PHP versions for the lint matrix'
        required: false
        type: string
        default: '["8.1","8.2","8.3"]'
      has-js:
        description: 'Plugin has a JS/asset build (npm run build)'
        required: false
        type: boolean
        default: false
      run-tsc:
        description: 'Run a standalone `tsc --noEmit` type check (only for plugins whose tsconfig supports it; wp-scripts/webpack builds usually do not)'
        required: false
        type: boolean
        default: false
      run-phpunit:
        description: 'Run vendor/bin/phpunit'
        required: false
        type: boolean
        default: false
      run-i18n:
        description: 'Diff languages/<slug>.pot against a fresh make-pot'
        required: false
        type: boolean
        default: false
      run-plugin-check:
        description: 'Run the official WordPress Plugin Check'
        required: false
        type: boolean
        default: true
      run-playwright:
        description: 'Run the Playwright CLS smoke suite'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax check
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            php -l "$f" || failed=1
          done < <(find src config templates -name '*.php' -print0 2>/dev/null)
          exit "$failed"

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - if: ${{ inputs.has-js }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - if: ${{ inputs.has-js }}
        run: npm install && npm run build
      - run: vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=2G

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs --standard=phpcs.xml.dist -n

  typescript:
    name: TypeScript Check
    if: ${{ inputs.run-tsc }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx tsc --noEmit

  phpunit:
    name: PHPUnit
    if: ${{ inputs.run-phpunit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  plugin-check:
    name: Plugin Check
    if: ${{ inputs.run-plugin-check }}
    # Advisory wp.org SUBMISSION gate (not a routine-dev gate). Boots wp-env with
    # WordPress + WooCommerce + this plugin (these plugins require WooCommerce, which
    # is why the bare action couldn't initialise), then runs the official
    # `wp plugin check`. Non-blocking — read its output before submitting to wp.org.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install runtime deps (ship the kit)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - if: ${{ inputs.has-js }}
        run: npm install && npm run build
      - name: Boot WordPress + WooCommerce + plugin (wp-env)
        run: npx --yes @wordpress/env@^10 start
      - name: Activate WooCommerce + this plugin
        run: npx --yes @wordpress/env@^10 run cli wp plugin activate woocommerce ${{ inputs.slug }}
      - name: Install Plugin Check
        run: npx --yes @wordpress/env@^10 run cli wp plugin install plugin-check --activate
      - name: Run Plugin Check
        run: npx --yes @wordpress/env@^10 run cli wp plugin check ${{ inputs.slug }} --severity=5

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - if: ${{ inputs.has-js }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - if: ${{ inputs.has-js }}
        run: npm install && npm audit --audit-level=critical

  i18n:
    name: i18n Check
    if: ${{ inputs.run-i18n }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install WP-CLI (pinned + checksum-verified)
        env:
          WP_CLI_VERSION: '2.12.0'
          WP_CLI_SHA512: 'be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832'
        run: |
          curl -fsSLo wp-cli.phar "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar"
          echo "${WP_CLI_SHA512}  wp-cli.phar" | sha512sum -c -
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
      - name: Generate POT and check for drift
        run: |
          wp i18n make-pot . /tmp/${{ inputs.slug }}-check.pot \
            --exclude=node_modules,vendor,build,tests --domain=${{ inputs.slug }}
          diff -u \
            <(grep -v 'POT-Creation-Date' languages/${{ inputs.slug }}.pot) \
            <(grep -v 'POT-Creation-Date' /tmp/${{ inputs.slug }}-check.pot)

  playwright:
    name: CLS smoke (Playwright)
    if: ${{ inputs.run-playwright }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
